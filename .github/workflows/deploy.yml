name: Deploy Backend to rumahweb

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: rumahweb-be-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Install dependencies
        run: |
          npm ci --omit=dev

      - name: Stage deploy artifact
        run: |
          set -e
          rm -rf .deploy
          mkdir -p .deploy
          cp -r src prisma package.json package-lock.json node_modules .deploy/
          mkdir -p .deploy/tmp
          date > .deploy/tmp/restart.txt
          # node_modules is built entirely on the GitHub Actions runner and
          # uploaded as-is - npm ci is never run on the server itself, since
          # this host's shared-hosting account can't sustain it (confirmed
          # with rumahweb support: process/resource limits). The backend has
          # no Prisma dependency; prisma/schema.prisma and prisma/migrations/
          # are kept only as historical schema documentation, and any schema
          # change is applied manually as hand-authored SQL against the
          # external DB host.
          # tmp/restart.txt is included in the upload itself (rather than a
          # separate SSH-triggered touch) since Passenger only needs its
          # mtime bumped, which a fresh upload already does.

      - name: Deploy via SSH (single tarball)
        env:
          SSH_HOST: ${{ secrets.RUMAHWEB_SSH_HOST }}
          SSH_USER: ${{ secrets.RUMAHWEB_SSH_USER }}
          SSH_PORT: ${{ secrets.RUMAHWEB_SSH_PORT }}
          TARGET_PATH: ${{ secrets.RUMAHWEB_BE_PATH }}
        run: |
          set -e
          # node_modules has thousands of small files; uploading file-by-file
          # over FTP hits this host's FTP session/command-rate limit partway
          # through every time (same file, every run). Packing the whole
          # deploy into one tarball and transferring it as a single file over
          # SSH/SCP avoids that limit entirely - the file-by-file constraint
          # never applies to what's inside the archive.
          mkdir -p ~/.ssh
          echo "${{ secrets.RUMAHWEB_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          tar -czf deploy.tar.gz -C .deploy .
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            deploy.tar.gz "$SSH_USER@$SSH_HOST:~/deploy-be.tar.gz"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "
              set -e
              rm -rf '$TARGET_PATH/node_modules' '$TARGET_PATH/src' '$TARGET_PATH/prisma'
              mkdir -p '$TARGET_PATH'
              tar -xzf ~/deploy-be.tar.gz -C '$TARGET_PATH'
              rm ~/deploy-be.tar.gz
            "

name: Deploy Backend to rumahweb

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm ci --omit=dev

      - name: Stage deploy artifact
        run: |
          set -e
          rm -rf .deploy
          mkdir -p .deploy
          cp -r src prisma package.json package-lock.json node_modules .deploy/
          mkdir -p .deploy/tmp
          date > .deploy/tmp/restart.txt
          # node_modules is built entirely on the GitHub Actions runner and
          # uploaded as-is - npm ci is never run on the server itself, since
          # this host's shared-hosting account can't sustain it (confirmed
          # with rumahweb support: process/resource limits). The backend has
          # no Prisma dependency; prisma/schema.prisma and prisma/migrations/
          # are kept only as historical schema documentation, and any schema
          # change is applied manually as hand-authored SQL against the
          # external DB host.
          #
          # rumahweb support confirmed SSH/SCP from GitHub Actions is not
          # reliably supported on this shared-hosting account, and directed
          # us to FTP instead - hence this step's deploy transport.
          # tmp/restart.txt is included in the upload itself (rather than a
          # separate SSH-triggered touch) since Passenger only needs its
          # mtime bumped, which a fresh upload already does.

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.RUMAHWEB_FTP_HOST }}
          username: ${{ secrets.RUMAHWEB_FTP_USER }}
          password: ${{ secrets.RUMAHWEB_FTP_PASSWORD }}
          port: ${{ secrets.RUMAHWEB_FTP_PORT }}
          server-dir: ${{ secrets.RUMAHWEB_BE_PATH }}/
          local-dir: ./.deploy/
          protocol: ftps

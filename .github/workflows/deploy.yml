name: Deploy Backend to rumahweb

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm ci --omit=dev

      - name: Upload prebuilt app via SCP
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.RUMAHWEB_SSH_HOST }}
          port: ${{ secrets.RUMAHWEB_SSH_PORT }}
          username: ${{ secrets.RUMAHWEB_SSH_USER }}
          key: ${{ secrets.RUMAHWEB_SSH_KEY }}
          source: "src/,prisma/,package.json,package-lock.json,node_modules/"
          target: ${{ secrets.RUMAHWEB_BE_PATH }}
          strip_components: 0

      - name: Restart app
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.RUMAHWEB_SSH_HOST }}
          port: ${{ secrets.RUMAHWEB_SSH_PORT }}
          username: ${{ secrets.RUMAHWEB_SSH_USER }}
          key: ${{ secrets.RUMAHWEB_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.RUMAHWEB_BE_PATH }}
            mkdir -p tmp && touch tmp/restart.txt
            # node_modules is built entirely on the GitHub Actions runner and
            # uploaded as-is - npm ci is never run on the server itself, since
            # this host's shared-hosting account can't sustain it (confirmed
            # with rumahweb support: process/resource limits). The backend has
            # no Prisma dependency; prisma/schema.prisma and prisma/migrations/
            # are kept only as historical schema documentation, and any schema
            # change is applied manually as hand-authored SQL against the
            # external DB host.

name: Debug FTP Paths (temporary)

on:
  workflow_dispatch: {}

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List FTP root and configured target directory
        env:
          FTP_HOST: ${{ secrets.RUMAHWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.RUMAHWEB_FTP_USER }}
          FTP_PASS: ${{ secrets.RUMAHWEB_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.RUMAHWEB_FTP_PORT }}
          FTP_PATH: ${{ secrets.RUMAHWEB_BE_PATH }}
        run: |
          echo "--- FTP account root listing ---"
          curl --ftp-ssl -s --list-only "ftp://$FTP_HOST:$FTP_PORT/" --user "$FTP_USER:$FTP_PASS"
          echo "--- Configured target path (RUMAHWEB_BE_PATH) listing ---"
          curl --ftp-ssl -s --list-only "ftp://$FTP_HOST:$FTP_PORT/$FTP_PATH/" --user "$FTP_USER:$FTP_PASS"
          echo "--- Absolute PWD at login (before any cd) ---"
          curl --ftp-ssl -v "ftp://$FTP_HOST:$FTP_PORT/" --user "$FTP_USER:$FTP_PASS" -Q "PWD" -o /dev/null 2>&1 | grep "257"
          echo "--- Absolute PWD inside configured target path ---"
          curl --ftp-ssl -v "ftp://$FTP_HOST:$FTP_PORT/$FTP_PATH/" --user "$FTP_USER:$FTP_PASS" -Q "-PWD" -o /dev/null 2>&1 | grep "257"
